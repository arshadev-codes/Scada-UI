<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Typeface options</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=Sora:wght@300..800&family=Red+Hat+Display:wght@400..900&family=Red+Hat+Text:wght@400..700&display=swap" rel="stylesheet" />
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet" />
<style>
  :root {
    --page: #eef1f0; --panel: #ffffff; --line: #dce2df; --ink: #16202a; --muted: #4b5864; --dim: #7a8590;
    --copper: #a94b14; --copper-tint: #f6e4d7; --ok: #16804a; --live: #e6a100;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; padding: 32px 16px 64px; }
  .wrap { max-width: 1240px; margin: 0 auto; }
  .intro { font-size: 15px; color: var(--muted); margin: 0 0 24px; max-width: 70ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(540px, 1fr)); gap: 20px; }
  @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }
  .opt { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px 24px; }
  .letter { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: #fff; font: 700 14px/1 system-ui; margin-right: 10px; }
  .name { font: 600 14px/1.3 system-ui; color: var(--muted); display: flex; align-items: center; margin-bottom: 18px; }
  .name small { margin-left: 8px; color: var(--dim); font-weight: 400; }
  .bus { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); margin-bottom: 22px; flex-wrap: wrap; }
  .bus .dot { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; border: 2px solid var(--copper); }
  .bus .done { background: var(--copper); color: #fff; }
  .bus .act { color: var(--copper); }
  .bus .bar { width: 26px; height: 3px; border-radius: 2px; background: var(--copper); }
  .bus .off { background: var(--line); }
  .bus b { color: var(--ink); }
  h1 { margin: 0; line-height: 1.05; }
  .sub { color: var(--muted); margin: 8px 0 20px; font-size: 15px; }
  .panel { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .panel header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .panel h2 { margin: 0; font-size: 16px; }
  .tag { color: var(--dim); font-size: 12.5px; }
  .panel .body { padding: 16px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; align-items: end; }
  .big { font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; }
  .big span { font-size: 20px; color: var(--dim); margin-left: 4px; }
  .lbl { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .rows { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .rows div { background: #f6f8f7; border-radius: 10px; padding: 8px 10px; }
  .rows b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .ok { color: var(--ok); }
  .btns { display: flex; gap: 10px; margin-top: 16px; }
  .btn { border-radius: 10px; padding: 10px 18px; font-size: 15px; border: 1px solid #b4bfbb; background: #fff; color: var(--ink); }
  .btn.p { background: var(--copper); border-color: var(--copper); color: #fff; }
  .field { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
  .field div div { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-size: 15px; }

  /* A — Satoshi */
  .A { font-family: 'Satoshi', sans-serif; }
  .A h1 { font-weight: 900; font-size: 42px; letter-spacing: -0.03em; }
  .A h2, .A .bus b { font-weight: 700; letter-spacing: -0.01em; }
  .A .big, .A .rows b { font-weight: 500; letter-spacing: -0.02em; }
  .A .btn { font-weight: 700; }
  /* B — Instrument Sans */
  .B { font-family: 'Instrument Sans', sans-serif; }
  .B h1 { font-weight: 700; font-size: 42px; letter-spacing: -0.025em; }
  .B h2, .B .bus b { font-weight: 650; }
  .B .big, .B .rows b { font-weight: 500; font-stretch: 80%; }
  .B .btn { font-weight: 600; }
  /* C — General Sans */
  .C { font-family: 'General Sans', sans-serif; }
  .C h1 { font-weight: 600; font-size: 42px; letter-spacing: -0.03em; }
  .C h2, .C .bus b { font-weight: 600; letter-spacing: -0.01em; }
  .C .big, .C .rows b { font-weight: 500; letter-spacing: -0.02em; }
  .C .btn { font-weight: 600; }
  /* D — Red Hat Display / Text */
  .D { font-family: 'Red Hat Text', sans-serif; }
  .D h1, .D h2, .D .big, .D .rows b { font-family: 'Red Hat Display', sans-serif; }
  .D h1 { font-weight: 800; font-size: 42px; letter-spacing: -0.02em; }
  .D h2, .D .bus b { font-weight: 700; }
  .D .big, .D .rows b { font-weight: 500; }
  .D .btn { font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <p class="intro">Four typeface options for the test bench, each set with the same screen content. Pick the one that feels right; colours and layout stay the same.</p>
  <div class="grid">
    <!-- the same block four times, one per typeface -->
    <template id="tpl">
      <div class="bus"><span class="dot done">✓</span>Test object<span class="bar"></span><span class="dot done">✓</span>Test selection<span class="bar"></span><span class="dot act">3</span><b>Execution</b><span class="bar off"></span><span class="dot act" style="border-color:var(--line);color:var(--dim)">4</span>Summary</div>
      <h1>Insulation Resistance</h1>
      <p class="sub">Object TX-63045-B · HV energised · 2399 kVA · 11 kV / 440 V · Dyn11</p>
      <div class="panel">
        <header><h2>Megger on the transformer</h2><span class="tag">IRT-01</span></header>
        <div class="body">
          <div><div class="lbl">HV–LV insulation resistance</div><div class="big">13.40<span>GΩ</span></div></div>
          <div class="rows"><div><span class="lbl">R 15 s</span><b>4.82</b></div><div><span class="lbl">R 60 s</span><b>7.35</b></div><div><span class="lbl">DAI</span><b class="ok">1.53</b></div></div>
        </div>
      </div>
      <div class="field"><div><label>Customer name</label><div>Kalinga Power Distribution</div></div><div><label>Vector group</label><div>Dyn11</div></div></div>
      <div class="btns"><span class="btn p">Re-run</span><span class="btn">Next test</span></div>
    </template>
    <section class="opt A"><div class="name"><span class="letter">A</span>Satoshi<small>sleek, modern, confident</small></div><div class="slot"></div></section>
    <section class="opt B"><div class="name"><span class="letter">B</span>Instrument Sans<small>precise, technical, calm</small></div><div class="slot"></div></section>
    <section class="opt C"><div class="name"><span class="letter">C</span>General Sans<small>refined, airy, premium</small></div><div class="slot"></div></section>
    <section class="opt D"><div class="name"><span class="letter">D</span>Red Hat Display<small>industrial, sturdy, clear</small></div><div class="slot"></div></section>
  </div>
</div>
<script>
  const t = document.getElementById('tpl');
  document.querySelectorAll('.slot').forEach((s) => s.appendChild(t.content.cloneNode(true)));
</script>
</body>
</html>
