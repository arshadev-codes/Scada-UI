<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EEF1F0" />
    <script>
      // Apply the saved (or OS-preferred) theme before first paint — no flash.
      (function () {
        // Light (porcelain) is the main look; dark only when the operator chose it.
        var t = 'light';
        try {
          var saved = JSON.parse(localStorage.getItem('ttb01.theme') || 'null');
          var v = saved && saved.state && saved.state.theme;
          if (v === 'dark') t = 'dark';
        } catch (e) {}
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <title>TTB-01 · Transformer Test Bench</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
